[tox]
requires =
    tox>=4.20
    tox-uv>=1.20
env_list =
    py314-django52-drf318
    py314-django60-drf318
    py314-django61-drf318
    py313-django52-drf318
    py313-django60-drf318
    py313-django61-drf318
    py312-django52-drf318
    py312-django60-drf318
    py312-django61-drf318
    py311-django52-drf318
    py310-django52-drf318

[testenv]
runner = uv-venv-runner
description = Test a compatible Python / Django / DRF combination
package = editable
deps =
    channels[daphne]<5,>=4.3
    pytest<10,>=8.3
    pytest-cov<8,>=6
    pytest-django<5,>=4.11
    django52: Django<5.3,>=5.2
    django60: Django<6.1,>=6
    django61: Django<6.2,>=6.1
    drf318: djangorestframework<3.19,>=3.18.3
set_env =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
    PYTHONDONTWRITEBYTECODE = 1
commands =
    pytest {posargs:django_notification/tests}

[testenv:lint]
runner = uv-venv-runner
description = Check Python lint and formatting
skip_install = true
deps =
    black==25.1
    ruff<1,>=0.14
commands =
    ruff check django_notification
    black --check django_notification scripts
    ruff format --check django_notification/tests docs/conf.py

[testenv:security]
runner = uv-venv-runner
description = Static Bandit security scan
skip_install = true
deps =
    bandit[toml]<2,>=1.8
commands =
    bandit -c pyproject.toml -r django_notification

[testenv:build]
runner = uv-venv-runner
description = Build and check sdist and wheel
skip_install = true
deps =
    build<2,>=1.2
    twine<8,>=6
commands =
    python -m build
    twine check dist/*
